syntax = "proto3";

package openpni.distributed.acquisition;

// 探测器通道配置
message ChannelConfig {
    uint32 ip_source = 1;        // 源IP地址 (integer representation)
    uint32 port_source = 2;      // 源端口号
    uint32 ip_destination = 3;   // 目的IP地址 (integer representation)
    uint32 port_destination = 4; // 目的端口号
    uint32 channel_index = 5;    // 通道索引
}

// 采集算法类型
enum AcquisitionAlgorithmType {
    ALGORITHM_TYPE_UNSPECIFIED = 0;
    ALGORITHM_TYPE_SOCKET = 1;
    ALGORITHM_TYPE_DPDK = 2;
}

// DPDK 参数
message DpdkOptions {
    uint32 copy_thread_num = 1;
    uint32 rx_rings_per_port = 2;
    repeated string bind_ips = 3;
    uint32 rte_mbuf_double_pointer_size_multiply = 4;
    uint32 rte_mbuf_double_pointer_num_multiply = 5;
}

// 探测器源信息（由控制节点用于自动生成通道映射）
message DetectorSource {
    string detector_id = 1; // 可选：探测器标识
    uint32 ip_source = 2;
    uint32 port_source = 3;
}

// 目的地址分配规则（按 detector_sources 顺序分配）
message DetectorDestinationRule {
    uint32 ip_destination = 1;
    uint32 port_destination_base = 2;
    uint32 port_destination_stride = 3; // 0 视作 1
}

// 通道号分配规则（按 detector_sources 顺序分配）
message ChannelIndexRule {
    uint32 channel_index_base = 1;   // 缺省建议 0（与 acquisition.cpp 对齐）
    uint32 channel_index_stride = 2; // 0 视作 1
}

// 采集任务配置
message AcquisitionTask {
    // 全局配置
    uint32 storage_unit_size = 1;
    uint64 max_buffer_size = 2;
    uint32 time_switch_buffer_ms = 3;
    uint32 total_channel_num = 4; // 总通道数
    uint32 min_packet_size = 6;   // 最小包大小，用于过滤
    AcquisitionAlgorithmType algorithm_type = 7;
    DpdkOptions dpdk_options = 8;
    string session_name = 9;
    uint64 reserved_storage_gib = 10;
    uint64 max_file_size_mb = 11;

    // 自动映射输入：当 channels 为空且 detector_sources 非空时，
    // 由控制节点根据规则自动生成 channels 并下发给采集节点。
    repeated DetectorSource detector_sources = 12;
    DetectorDestinationRule destination_rule = 13;
    ChannelIndexRule channel_index_rule = 14;

    // 分配给该节点的通道列表
    repeated ChannelConfig channels = 5;
}

message StartControl {
    uint64 planned_start_time_ms = 1;
    uint32 duration_ms = 2;
}

message StopControl {
    string reason = 1;
}

message ShutdownControl {
    string reason = 1;
}

// 节点信息
message NodeInfo {
    string node_id = 1;       // 节点唯一标识
    string hostname = 2;      // 主机名
    string ip_address = 3;    // 节点IP
    uint32 cpu_cores = 4;     // CPU核心数 (可选，用于负载均衡)
    uint64 memory_size = 5;   // 内存大小 (可选)
}

// 指令类型
enum CommandType {
    CMD_UNKNOWN = 0;
    CMD_CONFIGURE = 1; // 配置参数
    CMD_START = 2;     // 开始采集
    CMD_STOP = 3;      // 停止采集
    CMD_SHUTDOWN = 4;  // 关闭节点
}

// 主服务器下发的指令
message MasterCommand {
    CommandType type = 1;
    AcquisitionTask task = 2; // 仅在 CMD_CONFIGURE 时有效
    string message = 3;       // 兼容旧版本，建议使用显式字段
    StartControl start_control = 4;
    StopControl stop_control = 5;
    ShutdownControl shutdown_control = 6;
}

// 节点状态
enum NodeState {
    STATE_UNKNOWN = 0;
    STATE_IDLE = 1;         // 空闲
    STATE_CONFIGURED = 2;   // 已配置
    STATE_RUNNING = 3;      // 正在采集
    STATE_ERROR = 4;        // 错误状态
}

// 节点上报的状态
message NodeStatus {
    NodeInfo info = 1;      // 节点基本信息 (首次连接或变更时发送)
    NodeState state = 2;    // 当前状态
    string error_message = 3; // 错误信息
    // 可以添加统计信息，如采集速率等
    double current_speed_mpps = 4;
    double current_bandwidth_mbps = 5;

    // Buffer usage statistics
    uint64 buffer_used = 6;
    uint64 buffer_volume = 7;
    float buffer_usage_percent = 8;

    // Error statistics
    uint64 total_rx_packets = 9;
    uint64 total_rx_bytes = 10;
    uint64 error_packets = 11; // unknown + dpdk errors
}

service AcquisitionControlService {
    // 节点连接到主服务器，建立双向流
    // 节点发送 NodeStatus，主服务器发送 MasterCommand
    rpc Connect (stream NodeStatus) returns (stream MasterCommand);
}
