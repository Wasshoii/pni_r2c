// 符合计算服务 gRPC 协议定义
// 用于分布式 PET 数据处理系统

syntax = "proto3";

package openpni.distributed.coincidence;

option cc_enable_arenas = true;

// ==================== 消息定义 ====================

// 单事件数据块（从分布式节点发送到主节点）
message SingleChunkMessage {
    uint32 node_id = 1;           // 节点ID
    uint64 chunk_id = 2;          // 块序号（用于顺序保证）
    uint64 computer_clock_ms = 3; // 计算机时钟（ms，粗略参考）
    uint32 duration_ms = 4;       // 持续时间（ms）
    reserved 5;                   // was: repeated SingleEvent singles

    // 批量发送时用于还原每个 segment 的顺序和时间信息。
    // 若为空，接收端应将整条消息视为单个 segment。
    repeated SegmentMeta segment_metas = 6;

    // 可选批次编号，仅用于诊断与追踪。
    uint64 batch_id = 7;

    // Packed binary singles: contiguous array of 16-byte records (little-endian),
    // layout per record: {u16 channelIndex, u16 crystalIndex, u64 timevalue_100fs, f32 energy}
    // Matches openpni::Single memory layout (#pragma pack(1)).
    bytes singles_packed = 8;
    uint32 singles_packed_count = 9;
}

// 批内 segment 元信息（用于在接收端恢复单段边界与时间信息）
message SegmentMeta {
    uint64 chunk_id = 1;          // segment 的全局序号（按节点内发送顺序递增）
    uint64 computer_clock_ms = 2; // 该 segment 对应的计算机时钟（ms）
    uint32 duration_ms = 3;       // 该 segment 持续时间（ms）
    uint32 singles_offset = 4;    // 在 singles 列表中的起始偏移
    uint32 singles_count = 5;     // 该 segment 的 singles 数量
}

// 流式传输响应
message StreamResponse {
    bool success = 1;
    uint64 singles_received = 2;
    string message = 3;
}

// 状态请求
message StatusRequest {
    // 可选：指定要查询的详细信息
    bool include_node_stats = 1;
}

// 节点状态
message NodeStatus {
    uint32 node_id = 1;
    uint64 chunks_received = 2;
    uint64 singles_received = 3;
    uint64 buffer_size = 4;
    bool connected = 5;
}

// 状态响应
message StatusResponse {
    uint64 total_singles_received = 1;
    uint64 total_singles_processed = 2;
    uint64 total_prompt_pairs = 3;
    uint64 total_delay_pairs = 4;
    uint64 alignment_windows_processed = 5;
    double avg_processing_time_ms = 6;
    uint64 current_time_boundary_pico = 7;
    bool is_running = 8;
    repeated NodeStatus node_stats = 9;

    // 编排状态
    uint32 expected_node_count = 10;
    uint32 connected_node_count = 11;
    bool start_signal_issued = 12;
}

// 控制命令
message ControlRequest {
    enum Command {
        START = 0;
        STOP = 1;
        PAUSE = 2;
        RESUME = 3;
        FLUSH = 4;
    }
    Command command = 1;
    bool wait_for_completion = 2; // 用于 STOP 命令
}

// 控制响应
message ControlResponse {
    bool success = 1;
    string message = 2;
}

// 配置更新请求
message ConfigUpdateRequest {
    // 符合协议参数
    int32 time_window_ps = 1;
    int32 delay_time_ps = 2;
    float energy_lower_ev = 3;
    float energy_upper_ev = 4;
    
    // 处理参数
    uint64 alignment_window_pico = 5;
    uint64 safety_margin_pico = 6;
}

// 配置更新响应
message ConfigUpdateResponse {
    bool success = 1;
    string message = 2;
}

// Singles data-plane kind (gRPC StreamSingles removed from hot path).
enum DataPlaneKind {
    DATA_PLANE_UNSPECIFIED = 0;
    DATA_PLANE_RDMA_ROCE_V2 = 1;
    DATA_PLANE_INPROCESS = 2; // same-process memcpy when no IB device
}

// 节点注册请求
message RegisterNodeRequest {
    uint32 node_id = 1;
    string node_address = 2;
    uint32 channel_count = 3;
    string detector_type = 4; // "BDM2" or "BDMBiD"
}

// 节点注册响应
message RegisterNodeResponse {
    bool success = 1;
    string message = 2;
    uint32 assigned_node_id = 3;

    // 编排信息（用于节点侧日志与状态确认）
    uint32 expected_node_count = 4;
    uint32 connected_node_count = 5;
    bool start_signal_issued = 6;
    uint64 planned_start_time_ms = 7;

    // Data plane is RDMA-only; kind echoed for clients.
    DataPlaneKind data_plane_kind = 8;
}

// RoCE / in-process endpoint exchanged over the gRPC control plane.
message RdmaEndpoint {
    DataPlaneKind kind = 1;
    bytes gid = 2;              // 16 bytes GID (RoCE)
    uint32 lid = 3;
    uint32 qp_num = 4;
    uint32 psn = 5;
    uint32 rkey = 6;
    uint64 base_addr = 7;
    uint32 slot_count = 8;
    uint32 slot_stride = 9;
    uint32 notify_rkey = 10;
    uint64 notify_addr = 11;
    uint32 notify_capacity = 12;
    uint32 consumer_rkey = 13;
    uint64 consumer_addr = 14;
    string device_name = 15;
    uint32 port_num = 16;
    uint32 gid_index = 17;
    uint64 inprocess_handle = 18;
}

message OpenDataPlaneRequest {
    uint32 node_id = 1;
    RdmaEndpoint node_endpoint = 2; // required for RoCE QP handshake
    uint32 requested_slot_count = 3;
    uint32 requested_slot_bytes = 4;
}

message OpenDataPlaneResponse {
    bool success = 1;
    string message = 2;
    DataPlaneKind data_plane_kind = 3;
    RdmaEndpoint coin_endpoint = 4;
}

// 节点等待主机发出开始信号
message WaitForStartRequest {
    uint32 node_id = 1;
    uint32 timeout_ms = 2; // 0 = 使用服务端默认等待时长
}

message WaitForStartResponse {
    bool success = 1;
    bool start_signal_issued = 2;
    uint64 start_time_ms = 3;
    string message = 4;
    uint32 expected_node_count = 5;
    uint32 connected_node_count = 6;
}

// 心跳请求
message HeartbeatRequest {
    uint32 node_id = 1;
    uint64 timestamp_ms = 2;
    uint64 singles_sent = 3;
}

// 心跳响应
message HeartbeatResponse {
    bool acknowledged = 1;
    uint64 server_timestamp_ms = 2;
}

// ==================== 服务定义 ====================

// 符合计算主服务
service CoincidenceService {
    // Legacy gRPC singles stream — disabled; use OpenDataPlane + RDMA.
    rpc StreamSingles(stream SingleChunkMessage) returns (StreamResponse);

    // Open / handshake RDMA (or in-process) singles data plane for a node.
    rpc OpenDataPlane(OpenDataPlaneRequest) returns (OpenDataPlaneResponse);

    // 等待主机发出开始信号（标准编排流程）
    rpc WaitForStart(WaitForStartRequest) returns (WaitForStartResponse);
    
    // 获取处理状态
    rpc GetStatus(StatusRequest) returns (StatusResponse);
    
    // 控制命令
    rpc Control(ControlRequest) returns (ControlResponse);
    
    // 更新配置
    rpc UpdateConfig(ConfigUpdateRequest) returns (ConfigUpdateResponse);
    
    // 节点注册
    rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
    
    // 心跳
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// 分布式节点服务（可选，用于主节点向从节点发送命令）
service NodeService {
    // 开始采集
    rpc StartAcquisition(StartAcquisitionRequest) returns (StartAcquisitionResponse);
    
    // 停止采集
    rpc StopAcquisition(StopAcquisitionRequest) returns (StopAcquisitionResponse);
    
    // 获取节点状态
    rpc GetNodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
}

// 采集控制消息
message StartAcquisitionRequest {
    uint64 start_time_ms = 1;  // 约定的开始时间
    uint32 duration_ms = 2;    // 采集持续时间（0 = 无限）
}

message StartAcquisitionResponse {
    bool success = 1;
    string message = 2;
}

message StopAcquisitionRequest {
    bool flush_buffer = 1;     // 是否刷新缓冲区
}

message StopAcquisitionResponse {
    bool success = 1;
    uint64 total_singles_sent = 2;
}

message NodeStatusRequest {
}

message NodeStatusResponse {
    bool is_acquiring = 1;
    uint64 singles_generated = 2;
    uint64 singles_sent = 3;
    uint64 buffer_usage = 4;
}
